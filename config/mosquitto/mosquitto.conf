# Mosquitto Configuration for BioeSign Development
# For production, enable TLS and authentication

# Default listener (plain MQTT)
listener 1883
protocol mqtt
allow_anonymous true

# TLS listener (uncomment and configure for production)
# listener 8883
# protocol mqtt
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# require_certificate false

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
